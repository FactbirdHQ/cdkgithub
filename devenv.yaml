# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-26.05
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  devkit:
    url: github:FactbirdHQ/devkit
    inputs:
      nixpkgs:
        follows: nixpkgs
      git-hooks:
        follows: git-hooks
      treefmt-nix:
        follows: treefmt-nix

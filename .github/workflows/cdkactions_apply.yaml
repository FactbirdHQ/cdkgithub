# Generated by cdkactions. Do not modify
# Generated as part of the 'cdkgithub' stack.
concurrency:
  cancel-in-progress: false
  group: cdkgithub-apply
name: Apply
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allowDelete:
        default: false
        description: Delete teams that are absent from the manifest
        required: false
        type: boolean
      enableScim:
        default: false
        description: Link teams to their Entra ID groups via SCIM
        required: false
        type: boolean
permissions:
  contents: read
jobs:
  apply:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Synth manifest
        run: bun bin/cdkgithub.ts synth orgs/factbird.ts
      - env:
          ALLOW_DELETE: ${{ inputs.allowDelete }}
          ENABLE_SCIM: ${{ inputs.enableScim }}
          GITHUB_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        name: Apply
        run: |-
          FLAGS="--yes"
          [ "$ALLOW_DELETE" = "true" ] && FLAGS="$FLAGS --allow-delete"
          [ "$ENABLE_SCIM" = "true" ] && FLAGS="$FLAGS --enable-scim"
          bun bin/cdkgithub.ts apply $FLAGS

name: Carry Dependabot action bumps into the workflow source
on:
  pull_request:
    paths:
      - .github/workflows/**
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
jobs:
  push:
    if: ((github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) && needs.regenerate.outputs.changed == 'true')
    needs: regenerate
    permissions: {}
    runs-on: ubuntu-26.04
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ secrets.APP_ID }}
          permission-contents: write
          private-key: ${{ secrets.APP_PEM }}
      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.regenerate.outputs.artifactId }}
          path: ${{ runner.temp }}/action-pin-sync
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_PATTERN: ^cicd/main\.ts$
        name: Write the source files to the pull request branch
        run: |-
          set -euo pipefail
          root="$RUNNER_TEMP/action-pin-sync"
          expected_head="$HEAD_SHA"
          while IFS= read -r -d '' file; do
            case "$file" in
              /* | ../* | */../* | */.. | ..) echo "::error::Refusing path $file"; exit 1 ;;
            esac
            if ! printf '%s' "$file" | grep -Eq "$SOURCE_PATTERN"; then
              echo "::error::$file is not one of the configured sources"; exit 1
            fi
            if [ ! -f "$root/files/$file" ] || [ -L "$root/files/$file" ]; then
              echo "::error::$file is not a regular file in the artifact"; exit 1
            fi
            head=$(gh api "repos/$REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)
            if [ "$head" != "$expected_head" ]; then
              echo "::error::$HEAD_REF moved to $head after $expected_head; not overwriting it"; exit 1
            fi
            blob=$(gh api "repos/$REPOSITORY/contents/$file?ref=$expected_head" --jq .sha)
            expected_head=$(gh api -X PUT "repos/$REPOSITORY/contents/$file" \
              -f message="chore(deps): carry action bumps into the workflow source" \
              -f content="$(base64 -w0 "$root/files/$file")" \
              -f branch="$HEAD_REF" \
              -f sha="$blob" \
              --jq .commit.sha)
            echo "Wrote $file in $expected_head"
          done < "$root/paths"
  regenerate:
    if: (github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      artifactId: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.changes.outputs.changed }}
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        name: Carry the bumps into the source
        run: npx --no cdkactions sync-action-pins --base "$BASE_SHA" --workflows '.github/workflows' 'cicd/main.ts'
      - name: Verify each versioned pin against its tag
        run: npx --no cdkactions verify-action-pins 'cicd/main.ts'
      - name: Synthesize
        run: bun run synth:workflows
      - name: Check the source reproduces the workflows
        run: git diff --exit-code -- '.github/workflows'
      - id: changes
        name: Collect the changed source files
        run: |-
          git diff --name-only -z -- ':(glob)cicd/main.ts' > "$RUNNER_TEMP/changed-sources"
          if [ ! -s "$RUNNER_TEMP/changed-sources" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/action-pin-sync/files"
          cp "$RUNNER_TEMP/changed-sources" "$RUNNER_TEMP/action-pin-sync/paths"
          xargs -0 cp --parents -t "$RUNNER_TEMP/action-pin-sync/files" < "$RUNNER_TEMP/changed-sources"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - id: upload
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: action-pin-sync
          path: ${{ runner.temp }}/action-pin-sync
          retention-days: 1
